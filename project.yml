name: FastScan
options:
  bundleIdPrefix: com.garrettbjerkhoel
  deploymentTarget:
    macOS: "26.0"
packages:
  ScanKit:
    path: .
targets:
  FastScan:
    type: application
    platform: macOS
    sources:
      - App/FastScan
    dependencies:
      - package: ScanKit
        product: ScanKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garrettbjerkhoel.FastScan
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/FastScan/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FastScan/FastScan.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # Xcode's ad hoc signature is temporary. script/build bundles SANE and script/sign signs
        # the app again, with the hardened runtime whenever the identity is a real one.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
