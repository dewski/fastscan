name: FastScan
options:
  bundleIdPrefix: com.garrettbjerkhoel
  deploymentTarget:
    macOS: "26.0"
packages:
  ScanKit:
    path: .
targets:
  FastScan:
    type: application
    platform: macOS
    sources:
      - App/FastScan
    dependencies:
      - package: ScanKit
        product: ScanKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garrettbjerkhoel.FastScan
        INFOPLIST_FILE: App/FastScan/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # Library validation would refuse Homebrew's libsane and its dlopen'd backends.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
